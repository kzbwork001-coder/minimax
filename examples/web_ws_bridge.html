<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>WebClient FE demo</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 420px; margin: 3rem auto; padding: 0 1rem; }
      h1 { font-size: 1.25rem; }
      fieldset { border: 1px solid #ddd; margin: 0 0 1rem; padding: 1rem; }
      fieldset[disabled] { opacity: 0.4; }
      legend { font-weight: 600; padding: 0 0.4rem; }
      input { width: 100%; padding: 0.5rem; margin: 0.25rem 0 0.75rem; box-sizing: border-box; }
      button { padding: 0.5rem 1rem; cursor: pointer; }
      #qr { display: block; margin: 0.5rem auto; }
      #log { background: #f5f5f5; padding: 0.75rem; font: 12px/1.4 monospace; white-space: pre-wrap; min-height: 4rem; border-radius: 4px; }
      .ok { color: #0a7d2c; } .err { color: #b00; }
    </style>
  </head>
  <body>
    <h1>WebClient QR login</h1>

    <fieldset id="startBox">
      <legend>1. Start</legend>
      <button id="start">Connect and request QR</button>
    </fieldset>

    <fieldset id="qrBox" disabled>
      <legend>2. Scan QR</legend>
      <img id="qr" alt="QR" width="240" height="240" />
      <div id="qrLink" style="font-size: 0.8rem; word-break: break-all;"></div>
    </fieldset>

    <fieldset id="pwBox" disabled>
      <legend>3. 2FA password (if prompted)</legend>
      <div id="hint" style="font-size: 0.85rem; color: #666;"></div>
      <input id="password" type="password" />
      <button id="sendPw">Submit</button>
    </fieldset>

    <div id="log"></div>

    <script>
      const log = document.getElementById("log");
      const say = (text, cls) => {
        const line = document.createElement("div");
        if (cls) line.className = cls;
        line.textContent = text;
        log.appendChild(line);
      };
      const enable = (id, on) => { document.getElementById(id).disabled = !on; };

      let ws = null;

      document.getElementById("start").onclick = () => {
        ws = new WebSocket("ws://localhost:8765");
        ws.onopen = () => {
          say("connected; requesting QR");
          ws.send(JSON.stringify({ type: "start" }));
          enable("startBox", false);
        };
        ws.onclose = () => say("disconnected");
        ws.onerror = () => say("ws error", "err");
        ws.onmessage = (ev) => {
          const msg = JSON.parse(ev.data);
          say("<- " + ev.data);
          if (msg.type === "qr") {
            document.getElementById("qr").src =
              "https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=" + encodeURIComponent(msg.link);
            document.getElementById("qrLink").textContent = msg.link;
            enable("qrBox", true);
          } else if (msg.type === "password_required") {
            document.getElementById("hint").textContent = "hint: " + (msg.hint || "");
            enable("pwBox", true);
          } else if (msg.type === "success") { say("logged in", "ok"); ws.close(); }
          else if (msg.type === "error") say("error: " + msg.message, "err");
        };
      };

      document.getElementById("sendPw").onclick = () => {
        ws.send(JSON.stringify({ type: "password", password: document.getElementById("password").value }));
        enable("pwBox", false);
      };
    </script>
  </body>
</html>
