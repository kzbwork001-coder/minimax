[project]
name = "mini-max-wrapper"
version = "0.1.8"
description = "MAX wrapper"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "kzb" }]
keywords = ["max", "messenger", "oneme", "asyncio", "client"]

dependencies = [
    "pydantic",
    "websockets",
    "msgpack",
    "lz4",
]

[project.urls]
Homepage = "https://github.com/kzbwork001-coder/minimax"
Repository = "https://github.com/kzbwork001-coder/minimax"
Issues = "https://github.com/kzbwork001-coder/minimax/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minimax"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: unit tests",
    "integration: parody on integration tests",
]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "examples"]

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
]
ignore = [
    "RUF012",
    "SIM108",
]

[tool.ruff.lint.isort]
known-first-party = ["minimax"]
