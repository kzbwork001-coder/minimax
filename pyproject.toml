[project]
name = "minimax"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pydantic",
    "websockets",
    "msgpack",
    "lz4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minimax"]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "examples"]

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
]
ignore = [
    "RUF012",
    "SIM108",
]

[tool.ruff.lint.isort]
known-first-party = ["minimax"]
